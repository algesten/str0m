[package]
name = "str0m-apple-crypto"
version = "0.6.0"
description = "Apple CommonCrypto/Security framework backend for str0m WebRTC"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/algesten/str0m"
readme = "README.md"

# MSRV
rust-version = "1.89.0"

[dependencies]
str0m-proto = { workspace = true, features = ["dtls"] }
dimpl.workspace = true
time.workspace = true

# Apple platform bindings
apple-cryptokit-rs = "0.2.1"
core-foundation = "0.10"
security-framework = "3.5"

# ASN.1/X.509 parsing for certificate handling
der.workspace = true
pkcs8.workspace = true
sec1.workspace = true
spki.workspace = true
x509-cert.workspace = true

# Constant-time comparison for crypto
subtle.workspace = true

[build-dependencies]
# Compiles a tiny stub object that satisfies the Swift back-deployment autolink
# symbols removed in Xcode 26.x (see build.rs).
cc = "1"
