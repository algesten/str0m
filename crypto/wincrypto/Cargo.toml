[package]
name = "str0m-wincrypto"
version = "0.8.1"
description = "Supporting crate for str0m"
license = "MIT OR Apache-2.0"
repository = "https://github.com/algesten/str0m"
readme = "README.md"
edition = "2024"

# MSRV
rust-version = "1.85.0"

[dependencies]
str0m-proto = { workspace = true, features = ["dtls"] }
dimpl.workspace = true
windows = { version = "0.62", features = [
  "Win32_Security_Cryptography",
  "Win32_System_Rpc",
] }

[dev-dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[features]
# Compatibility alias: DTLS always uses dimpl.
dimpl = []
fips140 = []
